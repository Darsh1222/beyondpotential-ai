<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beyond Potential AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #14110F;
      --surface: #1C1815;
      --surface-2: #231E1A;
      --line: #2E2823;
      --paper: #ECE7DF;
      --muted: #938A7F;
      --jade: #6FA287;
      --jade-dim: #3C4F45;
      --jade-text: #0E1712;
    }

    html, body {
      height: 100%;
      background: var(--ink);
      color: var(--paper);
      font-family: 'Inter', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 780px;
      margin: 0 auto;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      background: linear-gradient(180deg, var(--surface) 0%, var(--ink) 100%);
      flex-shrink: 0;
    }

    .logo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 2.5px;
      width: 36px;
      height: 36px;
      padding: 5px;
      border: 1px solid var(--jade-dim);
      border-radius: 9px;
      flex-shrink: 0;
    }

    .logo-grid span {
      background: var(--surface-2);
      border-radius: 1.5px;
    }

    .logo-grid span.lit {
      background: var(--jade);
    }

    .header-text h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .15px;
    }

    .header-text p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--jade);
      display: inline-block;
    }

    /* SCROLL AREA */
    #scroll {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 12px;
      scroll-behavior: smooth;
    }

    #scroll::-webkit-scrollbar { width: 4px; }
    #scroll::-webkit-scrollbar-track { background: transparent; }
    #scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

    /* EMPTY STATE */
    #empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 8vh 20px 0;
    }

    .empty-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      width: 88px;
      height: 88px;
      margin-bottom: 28px;
    }

    .empty-grid span {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 4px;
    }

    .empty-grid span.lit {
      background: var(--jade-dim);
      border-color: var(--jade);
      box-shadow: 0 0 0 1px var(--jade);
    }

    #empty h2 {
      font-family: 'Fraunces', Georgia, serif;
      font-size: 26px;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 12px;
      max-width: 380px;
    }

    #empty p {
      color: var(--muted);
      font-size: 14.5px;
      line-height: 1.65;
      max-width: 400px;
      margin-bottom: 32px;
    }

    .starters {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
      max-width: 460px;
    }

    .starter-btn {
      text-align: left;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 13px 16px;
      color: var(--paper);
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: border-color .15s;
    }

    .starter-btn:hover { border-color: var(--jade-dim); }
    .starter-btn:active { transform: translateY(1px); }

    /* MESSAGES */
    #thread {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .msg-row {
      display: flex;
    }

    .msg-row.user { justify-content: flex-end; }

    .bubble {
      max-width: 82%;
      padding: 13px 16px;
      font-size: 15px;
      line-height: 1.65;
      border-radius: 16px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .msg-row.user .bubble {
      background: var(--jade);
      color: var(--jade-text);
      font-weight: 500;
      border-bottom-right-radius: 5px;
    }

    .msg-row.ai .bubble {
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--paper);
      border-bottom-left-radius: 5px;
    }

    /* TYPING INDICATOR */
    .typing {
      display: flex;
      gap: 5px;
      padding: 4px 2px;
      align-items: center;
    }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      animation: bounce 1.1s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: .15s; }
    .typing span:nth-child(3) { animation-delay: .3s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: .4; }
      40% { transform: translateY(-5px); opacity: 1; }
    }

    /* ERROR */
    #error-bar {
      display: none;
      padding: 10px 20px;
      background: #2A1A15;
      border-top: 1px solid #4A2A20;
      color: #D98C7A;
      font-size: 13px;
    }

    /* COMPOSER */
    #composer {
      border-top: 1px solid var(--line);
      padding: 14px 20px 20px;
      flex-shrink: 0;
    }

    .input-wrap {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 8px 8px 8px 18px;
      transition: border-color .15s;
    }

    .input-wrap:focus-within { border-color: var(--jade-dim); }

    #input {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: var(--paper);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.5;
      max-height: 160px;
      padding: 8px 0;
    }

    #input::placeholder { color: var(--muted); }

    #send-btn {
      flex-shrink: 0;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 12px;
      background: var(--jade);
      color: var(--jade-text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .15s;
    }

    #send-btn:disabled { opacity: .35; cursor: default; }
    #send-btn svg { pointer-events: none; }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
      letter-spacing: .3px;
    }

    @media (max-width: 500px) {
      .bubble { max-width: 90%; font-size: 14px; }
      #empty h2 { font-size: 22px; }
      header { padding: 14px 16px; }
      #scroll { padding: 20px 16px 8px; }
      #composer { padding: 12px 16px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; opacity: .6; }
    }
  </style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo-grid" aria-hidden="true">
      <span></span><span></span><span></span>
      <span></span><span class="lit"></span><span></span>
      <span></span><span></span><span></span>
    </div>
    <div class="header-text">
      <h1>Beyond Potential AI</h1>
      <p><span class="status-dot"></span>Trained on every Beyond Potential framework</p>
    </div>
  </header>

  <div id="scroll">
    <div id="empty">
      <div class="empty-grid" aria-hidden="true">
        <span></span><span></span><span></span>
        <span></span><span class="lit"></span><span></span>
        <span></span><span></span><span></span>
      </div>
      <h2>Tell me what you're stuck on.</h2>
      <p>We'll map it, shrink it, and find the one cell to start with. No hype. Just the next move.</p>
      <div class="starters">
        <button class="starter-btn">I know what I need to do but I never actually do it.</button>
        <button class="starter-btn">Why do I keep starting things and never finishing?</button>
        <button class="starter-btn">I've got too much to do and don't know where to start.</button>
        <button class="starter-btn">I've been procrastinating for weeks. Help.</button>
      </div>
    </div>
    <div id="thread" style="display:none;"></div>
  </div>

  <div id="error-bar">Connection dropped. Try sending that again.</div>

  <div id="composer">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="What are you avoiding right now?"></textarea>
      <button id="send-btn" disabled aria-label="Send message">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 19V5M5 12l7-7 7 7"/>
        </svg>
      </button>
    </div>
    <p class="footer-note">Pick one cell. Start there.</p>
  </div>

</div>

<script>
  const scrollEl = document.getElementById('scroll');
  const emptyEl = document.getElementById('empty');
  const threadEl = document.getElementById('thread');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('send-btn');
  const errorBar = document.getElementById('error-bar');

  let messages = [];
  let loading = false;

  // Auto-grow textarea
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
    sendBtn.disabled = !inputEl.value.trim() || loading;
  });

  // Enter to send (shift+enter for newline)
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!sendBtn.disabled) send();
    }
  });

  sendBtn.addEventListener('click', send);

  // Starter buttons
  document.querySelectorAll('.starter-btn').forEach(btn => {
    btn.addEventListener('click', () => send(btn.textContent));
  });

  function scrollToBottom() {
    setTimeout(() => {
      scrollEl.scrollTop = scrollEl.scrollHeight;
    }, 50);
  }

  function showThread() {
    emptyEl.style.display = 'none';
    threadEl.style.display = 'flex';
  }

  function addBubble(role, content) {
    const row = document.createElement('div');
    row.className = `msg-row ${role}`;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = content;
    row.appendChild(bubble);
    threadEl.appendChild(row);
    scrollToBottom();
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg-row ai';
    row.id = 'typing-row';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(bubble);
    threadEl.appendChild(row);
    scrollToBottom();
  }

  function removeTyping() {
    const el = document.getElementById('typing-row');
    if (el) el.remove();
  }

  async function send(text) {
    const content = (text ?? inputEl.value).trim();
    if (!content || loading) return;

    errorBar.style.display = 'none';
    showThread();

    messages.push({ role: 'user', content });
    addBubble('user', content);

    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.disabled = true;
    loading = true;

    addTyping();

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages })
      });

      const data = await res.json();
      removeTyping();

      if (!res.ok || !data.reply) {
        errorBar.style.display = 'block';
        messages.pop();
        return;
      }

      messages.push({ role: 'assistant', content: data.reply });
      addBubble('ai', data.reply);

    } catch (err) {
      removeTyping();
      errorBar.style.display = 'block';
      messages.pop();
    } finally {
      loading = false;
      sendBtn.disabled = !inputEl.value.trim();
    }
  }
</script>
</body>
</html>
